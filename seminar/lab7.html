<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Khan Bank - Basic HTML & CSS</title>
    <style>
        /* 1. Ерөнхий тохиргоо */
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        /* 2. Дээд талын ногоон тууз */
        .top-bar {
            background-color: #004d33;
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            font-size: 13px;
        }

        .top-bar a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            margin-right: 15px;
        }

        .top-bar a.active {
            background-color: white;
            color: black;
            padding: 5px 10px;
        }

        /* 3. Лого болон Интернет банкны хэсэг */
        .main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid #ddd;
        }

        .logo-section {
            display: flex;
            align-items: center;
        }

        .logo-text {
            color: #004d33;
            font-size: 24px;
            font-weight: bold;
            margin-left: 10px;
        }

        .btn-internet-bank {
            background-color: #004d33;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        /* 4. Цэс (Sub Navigation) */
        .sub-nav {
            padding: 15px 20px;
        }

        .sub-nav a {
            color: #555;
            text-decoration: none;
            margin-right: 25px;
            font-size: 14px;
            font-weight: 500;
        }

        /* 5. Баннер (Hero Section) */
        .banner {
            background-color: #004d33;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .banner-container {
            display: flex;
            align-items: center;
        }

        .banner-title {
            font-size: 60px;
            letter-spacing: 5px;
            margin: 0;
        }

        .vertical-line {
            width: 1px;
            height: 100px;
            background-color: white;
            margin: 0 50px;
            opacity: 0.5;
        }

        .anniversary-circle {
            border: 2px solid white;
            border-radius: 50%;
            width: 160px;
            height: 160px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .anniversary-circle span {
            font-size: 50px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div>
            <a href="#" class="active">Иргэд</a>
            <a href="#">Priority</a>
            <a href="#">Signature</a>
            <a href="#">ХААН Бизнес</a>
        </div>
        <div>
            <span>Хөрөнгө оруулагчид | Салбар | EN</span>
        </div>
    </div>
