<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LAB4</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: blanchedalmond;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-box {
      background: #fff;
      padding: 40px;
      width: 300px;
      text-align: center;
    }

    .login-box img {
      width: 80px;
      margin-bottom: 20px;
    }

    .login-box input[type="email"],
    .login-box input[type="password"] {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
    }

    .login-box .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      margin: 10px 0;
    }

    .login-box button {
      width: 100%;
      padding: 10px;
      background: #e1ece1;
      color: #fff;
      font-size: 16px;
    }
    
    .login-box a {
      color: #2E7D32;
      font-size: 14px;
    }

    .login-box b {
      color: rgb(121, 208, 45);
      background-color: rgb(130, 123, 115);
      font-family: Arial, Helvetica, sans-serif;
      font-size: small;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <form action="https://www.facebook.com/tamir.munkhdul" method="GET">
  <input type="email" name="email" placeholder="Email ID" required>
  <input type="password" name="password" placeholder="Password" required>
  <button type="submit">LOGIN</button>
</form>
  </div>
</body>
</html>
