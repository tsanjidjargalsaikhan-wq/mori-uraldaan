<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAB 7 - GET Method</title>
    <style>
        /* Таны өмнөх CSS загварууд энд байна */
        .container { display: grid; grid-template-columns: 250px 1fr; grid-template-rows: 80px 1fr 60px; height: 100vh; }
        .header { background: #2c3e50; display: flex; align-items: center; justify-content: space-around; padding: 0 20px; }
        .sidebar { background: #ecf0f1; padding: 20px; }
        .main-content { padding: 20px; }
        .search-box { margin-bottom: 20px; padding: 15px; background: #f8f9fa; border-radius: 8px; }
        input[type="text"] { padding: 8px; width: 250px; border: 1px solid #ddd; }
        button[type="submit"] { padding: 8px 15px; background: #3498db; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <nav class="header">
            <a href="?page=home"><button>Нүүр хуудас</button></a>
            <a href="?page=gallery"><button>Зурагнууд</button></a>
            <a href="?page=projects"><button>Төслүүд</button></a>
            <a href="?page=contacts"><button>Холбоо барих</button></a>
        </nav>

        <aside class="sidebar">
            <div class="profile-pic">
                <img src="Zurag.jpg" alt="Kate Dudley" width="200" height="255">
                <p><strong>Kate Dudley</strong> [cite: 39]</p>
                <p>Administrator [cite: 185]</p>
            </div>
            <div class="personal-info">
                <h3>Цэсүүд</h3>
                <ul>
                    <li><a href="?cat=analytics">Analytics</a> [cite: 21]</li>
                    <li><a href="?cat=users">User List</a> [cite: 102]</li>
                </ul>
            </div>
        </aside>

        <main class="main-content">
            <div class="search-box">
                <form action="" method="GET">
                    <input type="text" name="search" placeholder="Төсөл эсвэл нэр хайх...">
                    <button type="submit">Хайх</button>
                </form>
            </div>

            <div id="content-area">
                <h1>ҮР ДҮН</h1>
                <p id="status-msg">Мэдээлэл хайж байна...</p>
                
                <div style="margin-top: 20px; border: 1px solid #eee; padding: 10px;">
                    <p>Нийт зочид: 18.2k </p>
                    <p>Идэвхтэй хэрэглэгч: 2.2k [cite: 40]</p>
                </div>
            </div>
        </main>

        <footer class="footer">
            Улаанбаатар хот, IO Institute & UFE [cite: 1, 9]
        </footer>
    </div>

    <script>
        // URL-аас GET утгуудыг унших функц
        const urlParams = new URLSearchParams(window.location.search);
        const searchQuery = urlParams.get('search');
        const pageName = urlParams.get('page');

        if (searchQuery) {
            document.getElementById('status-msg').innerText = "Хайлтын илэрц: " + searchQuery;
        } else if (pageName) {
            document.getElementById('status-msg').innerText = "Таны үзэж буй хуудас: " + pageName;
        }
    </script>
</body>
</html>
