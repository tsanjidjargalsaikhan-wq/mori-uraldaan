<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Бүртгэл</title>
</head>
<body>

<h2>Хэрэглэгчийн бүртгэл</h2>

Нэр: <input type="text" id="ner"><br><br>
Овог: <input type="text" id="ovog"><br><br>
Нас: <input type="number" id="nas"><br><br>

<button onclick="burtgeh()">Бүртгэх</button>

<br><br>

<table border="1" id="table">
    <tr>
        <th>Овог нэр</th>
        <th>Нас</th>
        <th>Үйлдэл</th>
    </tr>
</table>

<script>
function burtgeh() {
    let ner = document.getElementById("ner").value;
    let ovog = document.getElementById("ovog").value;
    let nas = document.getElementById("nas").value;

    let table = document.getElementById("table");

    let tr = document.createElement("tr");

    let td1 = document.createElement("td");
    td1.innerText = ovog + " " + ner;

    let td2 = document.createElement("td");
    td2.innerText = nas;

    let td3 = document.createElement("td");

    let btn = document.createElement("button");
    btn.innerText = "Устгах";

    btn.onclick = function() {
        tr.remove();
    };

    td3.appendChild(btn);

    tr.appendChild(td1);
    tr.appendChild(td2);
    tr.appendChild(td3);

    table.appendChild(tr);
    
    document.getElementById("ner").value = "";
    document.getElementById("ovog").value = "";
    document.getElementById("nas").value = "";
}
</script>

</body>
</html>
