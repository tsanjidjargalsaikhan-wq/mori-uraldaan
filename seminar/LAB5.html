<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAB 7 - Зассан</title>
    <style>
        /* Ерөнхий тохиргоо */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
        }

        /* ГРИД БҮТЭЦ - Desktop үед */
        .container {
            display: grid;
            height: 100vh;
            grid-template-columns: 250px 1fr; /* Sidebar 250px, Main үлдсэн хэсэг */
            grid-template-rows: 80px 1fr 60px; /* Header, Main, Footer өндөр */
            grid-template-areas: 
                "header header"
                "sidebar main"
                "footer footer";
        }

        /* Хэсгүүдийн загвар */
        .header {
            grid-area: header;
            background-color: #2c3e50;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 20px;
        }

        .header button {
            padding: 10px 20px;
            cursor: pointer;
            border: none;
            background: #34495e;
            color: white;
            border-radius: 5px;
        }

        .sidebar {
            grid-area: sidebar;
            background-color: #ecf0f1;
            padding: 20px;
            border-right: 1px solid #bdc3c7;
        }

        .main-content {
            grid-area: main;
            padding: 20px;
            background-color: white;
        }

        .footer {
            grid-area: footer;
            background-color: #2c3e50;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Туслах класс (Лайн) */
        .line {
            height: 2px;
            background: #bdc3c7;
            margin: 15px 0;
            width: 100%;
        }

        /* --- RESPONSIVE ХЭСЭГ --- */

        /* Таблет (768px-ээс бага) */
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr; 
                grid-template-rows: 80px auto 100px;
                grid-template-areas: 
                    "header"
                    "main"
                    "footer";
            }

            .sidebar {
                display: none; /* Sidebar-ыг нуух */
            }
        }

        /* Гар утас (480px-ээс бага) */
        @media (max-width: 480px) {
            .header {
                flex-direction: column;
                height: auto;
                padding: 10px;
                gap: 5px;
            }

            .header button {
                width: 100%;
                font-size: 14px;
            }

            .main-content {
                padding: 15px;
                text-align: center;
            }

            .footer {
                font-size: 14px;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <nav class="header">
            <button>Нүүр хуудас</button>
            <button>Зурагнууд</button>
            <button>Бичлэгнүүд</button>
            <button>Газрын зураг</button>
        </nav>

        <aside class="sidebar">
            <div class="profile-pic">
                <img src="https://via.placeholder.com/200x255" alt="Profile" width="200" height="255" style="border-radius: 10px;">
            </div>
            <div class="personal-info">
                <h3 style="margin-top: 15px;">Хувийн мэдээлэл</h3>
                <div class="line"></div>
                <div class="line"></div>
                <div class="line"></div>
                <div class="line"></div>
                <div class="line"></div>
            </div>
        </aside>

        <main class="main-content">
            <h1>АГУУЛГА</h1>
            <p>Энэ хэсэгт таны үндсэн контент харагдах болно.</p>
        </main>

        <footer class="footer">
            Гэрийн хаяг: Улаанбаатар хот, Сүхбаатар дүүрэг...
        </footer>
    </div>
</body>
</html>
