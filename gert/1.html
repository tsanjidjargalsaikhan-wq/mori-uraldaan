<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashonic - HTML & CSS Only</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f3f4f7; font-family: 'Segoe UI', sans-serif; }

#sidebar-wrapper { min-height: 100vh; width: 250px; }
.sidebar-heading { padding: 1.5rem 1.25rem; }
.list-group-item { border: none; padding: 10px 20px; font-size: 14px; color: #545a6d; }
.active-link { background-color: #eef2ff !important; color: #556ee6 !important; font-weight: 600; }

.chart-visual {
    height: 200px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
}
.bar-container {
    height: 150px;
    display: flex;
    align-items: flex-end;
    gap: 15px;
    border-bottom: 1px solid #eee;
}
.bar {
    flex: 1;
    background: linear-gradient(to top, #3bafda, #4fc3f7);
    border-radius: 4px 4px 0 0;
    transition: height 0.5s ease;
}
.bar:hover { background: #556ee6; }

.donut-css {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background: conic-gradient(
        #f46a6a 0% 82%, 
        #f1b44c 82% 95%, 
        #556ee6 95% 100%
    );
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}
.donut-css::after {
    content: "";
    width: 100px;
    height: 100px;
    background: #fff;
    border-radius: 50%;
    position: absolute;
}

.card { border-radius: 10px; }
.badge { font-weight: 500; font-size: 11px; }
    </style>
</head>
<body>

<div class="d-flex" id="wrapper">
    <div class="bg-white border-end" id="sidebar-wrapper">
        <div class="sidebar-heading text-primary fw-bold fs-4">io UFE</div>
        <div class="list-group list-group-flush px-2">
            <small class="text-muted px-3 mt-3">DASHBOARDS</small>
            <a href="#" class="list-group-item list-group-item-action active-link border-0 rounded mt-1">
                <i class="fas fa-chart-line me-2"></i> Analytics
            </a>
            <small class="text-muted px-3 mt-4">APPLICATIONS</small>
            <a href="#" class="list-group-item list-group-item-action border-0 mt-1">
                <i class="fas fa-calendar me-2"></i> Calendar
            </a>
            <a href="#" class="list-group-item list-group-item-action border-0 mt-1 d-flex justify-content-between align-items-center">
                <span><i class="fas fa-address-book me-2"></i> Contacts</span>
                <i class="fas fa-chevron-down small"></i>
            </a>
            <div class="ps-4 mb-2">
                <a href="#" class="list-group-item list-group-item-action border-0 small py-1 text-primary fw-bold">User List</a>
            </div>
            <a href="#" class="list-group-item list-group-item-action border-0 mt-1">
                <i class="fas fa-folder me-2"></i> Projects
            </a>
        </div>
    </div>

    <div id="page-content-wrapper" class="w-100">
        <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom px-4">
            <div class="d-flex align-items-center">
                <i class="fas fa-bars me-3 text-muted"></i>
                <span class="text-muted small">Contacts > User List</span>
            </div>
            <div class="ms-auto d-flex align-items-center">
                <i class="fas fa-search me-4 text-muted"></i>
                <div class="profile d-flex align-items-center border-start ps-4">
                    <div class="text-end me-2">
                        <div class="fw-bold small">Kate Dudley</div>
                        <div class="text-muted small" style="font-size: 10px;">Administrator</div>
                    </div>
                    <img src="https://ui-avatars.com/api/?name=Kate+Dudley" class="rounded-circle" width="35">
                </div>
            </div>
        </nav>

        <div class="container-fluid p-4">
            <div class="row mb-4">
                <div class="col-lg-8">
                    <div class="card border-0 shadow-sm p-4">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h5 class="mb-0">Daily Active Users</h5>
                            <button class="btn btn-light btn-sm border">Yearly <i class="fas fa-chevron-down ms-1"></i></button>
                        </div>
                        <div class="row mb-4 text-center">
                            <div class="col-md-3 border-end">
                                <small class="text-muted d-block">Total Visitors</small>
                                <span class="fw-bold fs-5">18.2k</span> <span class="text-success small">+1.4%</span>
                            </div>
                            <div class="col-md-3 border-end">
                                <small class="text-muted d-block">Sessions</small>
                                <span class="fw-bold fs-5">3.85k</span>
                            </div>
                            <div class="col-md-3">
                                <small class="text-muted d-block">Bounce Rate</small>
                                <span class="fw-bold fs-5">24.03%</span>
                            </div>
                        </div>
                        <div class="chart-visual">
                            <div class="bar-container">
                                <div class="bar" style="height: 40%;"></div>
                                <div class="bar" style="height: 70%;"></div>
                                <div class="bar" style="height: 50%;"></div>
                                <div class="bar" style="height: 90%;"></div>
                                <div class="bar" style="height: 60%;"></div>
                                <div class="bar" style="height: 80%;"></div>
                                <div class="bar" style="height: 30%;"></div>
                                <div class="bar" style="height: 85%;"></div>
                            </div>
                            <div class="d-flex justify-content-between mt-2 text-muted small">
                                <span>01 Jan</span><span>04 Jan</span><span>08 Jan</span><span>12 Jan</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-4">
                    <div class="card border-0 shadow-sm p-4 h-100">
                        <h5>Visitors by Browser</h5>
                        <div class="donut-css mt-4 mx-auto"></div>
                        <div class="mt-4">
                            <div class="d-flex justify-content-between mb-1 small"><span>Chrome</span><span>82%</span></div>
                            <div class="progress mb-3" style="height: 6px;"><div class="progress-bar bg-danger" style="width: 82%"></div></div>
                            <div class="d-flex justify-content-between mb-1 small"><span>Firefox</span><span>70%</span></div>
                            <div class="progress mb-3" style="height: 6px;"><div class="progress-bar bg-warning" style="width: 70%"></div></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-white py-3 d-flex justify-content-between align
